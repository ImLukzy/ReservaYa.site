# Nginx HTTPS template for Educlook (LXC/Proxmox)
# Replace domain/certificate paths with your real values.

server {
  listen 80;
  listen [::]:80;
  server_name educlook.com www.educlook.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name educlook.com www.educlook.com;

  root /var/www/educlook/dist;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/educlook.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/educlook.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /robots.txt {
    access_log off;
  }

  location = /sitemap.xml {
    access_log off;
  }
}
