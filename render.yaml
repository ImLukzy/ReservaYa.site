# API .NET de ReservaYa; PostgreSQL externo en Neon.
# Blueprint: ImLukzy/ReservaYa.site, rama main; Dockerfile y contexto en la raíz.
# Los sync:false se completan en Render. En un servicio existente revisa
# Environment manualmente: el Blueprint no reemplaza esos valores.
services:
  - type: web
    name: reservaya-api
    repo: https://github.com/ImLukzy/ReservaYa.site
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Mismo secreto privado que JWT_SECRET de Vercel; mínimo 32 caracteres.
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://reservaya.site
      # Host público del bucket R2 (= NEXT_PUBLIC_MEDIA_URL de Vercel), sin barra final.
      - key: MEDIA_PUBLIC_URL
        sync: false
      # Mismas credenciales R2 que Vercel: la API borra del bucket la imagen reemplazada.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://reservaya.site/reset-password
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://reservaya.site/api/auth/google/callback
