name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [config, shared, db, api, web]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec turbo run build --filter=@reservaya/${{ matrix.package }}^...
      - name: Build secret (temporary)
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - if: matrix.package == 'web'
        run: pnpm --filter @reservaya/web exec next typegen
      - run: pnpm --filter @reservaya/${{ matrix.package }} typecheck
      - run: pnpm --filter @reservaya/${{ matrix.package }} lint
      - if: matrix.package == 'shared' || matrix.package == 'api' || matrix.package == 'web'
        run: pnpm --filter @reservaya/${{ matrix.package }} test
      - if: matrix.package != 'config'
        run: pnpm --filter @reservaya/${{ matrix.package }} build
      - if: matrix.package == 'web'
        run: node --test scripts/start-dev.test.mjs scripts/motion-tokens.test.mjs
      - if: matrix.package == 'web'
        run: node scripts/motion-tokens.mjs --check
  legacy:
    name: API .NET 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build apps/api-dotnet/ReservaFacil.Api.csproj --configuration Release
  baseline:
    name: Baseline desde base vacía
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: baseline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/baseline
      DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/baseline
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reservaya/db exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm --filter @reservaya/db exec prisma migrate status --schema prisma/schema.prisma
      - run: pnpm --filter @reservaya/db exec prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
