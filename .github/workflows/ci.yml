name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservaya-frontend-astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: reservaya-frontend-astro/package-lock.json
      - run: npm ci
      - run: npx astro check
      - run: npm run build

  panel:
    name: Panel (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservaya-nextjs-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: reservaya-nextjs-api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  db-check:
    name: DB Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservaya-nextjs-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: reservaya-nextjs-api/package-lock.json
      - run: npm ci
      - run: npm run db:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}