name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/parity?sslmode=disable
  DATABASE_URL_UNPOOLED: postgresql://fixture:fixture@127.0.0.1:5432/parity?sslmode=disable
  JWT_SECRET: ci-only-fictitious-signing-key-32-characters
jobs:
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Activate pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reservaya/config typecheck
      - run: pnpm --filter @reservaya/config lint
  shared:
    name: shared
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Activate pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@reservaya/shared
      - run: pnpm --filter @reservaya/shared typecheck
      - run: pnpm --filter @reservaya/shared lint
      - run: pnpm --filter @reservaya/shared test
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Activate pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@reservaya/db
      - run: pnpm --filter @reservaya/db typecheck
      - run: pnpm --filter @reservaya/db lint
      - run: pnpm --filter @reservaya/db validate
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Activate pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@reservaya/api
      - run: pnpm --filter @reservaya/api typecheck
      - run: pnpm --filter @reservaya/api lint
      - run: pnpm --filter @reservaya/api test
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Activate pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@reservaya/web
      - run: pnpm --filter @reservaya/web exec next typegen
      - run: pnpm --filter @reservaya/web typecheck
      - run: pnpm --filter @reservaya/web lint
      - run: pnpm --filter @reservaya/web test
      - run: node --test scripts/start-dev.test.mjs scripts/motion-tokens.test.mjs
      - run: node scripts/motion-tokens.mjs --check
